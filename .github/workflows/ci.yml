name: CAUCHE PULSE
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.31
      - run: uv sync --locked
      - run: uv run --locked ruff check app tests alembic
      - name: Start ephemeral PostgreSQL
        run: python "$GITHUB_WORKSPACE/scripts/ci_postgres.py" start
      - run: uv run --locked python -m pytest --cov=app --cov-report=term-missing
      - run: uv run --locked bandit -r app --severity-level medium
      - run: uv run --locked pip-audit
      - name: Stop ephemeral PostgreSQL
        if: always()
        run: python "$GITHUB_WORKSPACE/scripts/ci_postgres.py" stop

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build && npm run build:free
      - run: node --test tests/research.test.ts
      - run: npm audit --audit-level=moderate

  source-and-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - run: python scripts/validate_docs.py
      - run: >
          docker run --rm -v "${PWD}:/repo:ro" --workdir /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner /repo

  compose-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Configure ephemeral Compose environment
        run: python scripts/ci_secrets.py compose
      - name: Validate and start Compose
        run: |
          docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" config --quiet
          docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" up --build -d --wait
      - name: Verify migrations
        run: |
          docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" exec -T api alembic current --check-heads
          docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" exec -T api alembic check
      - name: Bootstrap ephemeral test owner
        run: python scripts/ci_secrets.py bootstrap
      - run: npm ci && npx playwright install --with-deps chromium && npm test
        working-directory: tests/e2e
      - run: npm audit --audit-level=moderate
        working-directory: tests/e2e
      - name: Rehearse isolated PostgreSQL backup and restore
        run: bash scripts/ci_restore.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-evidence
          path: tests/e2e/test-results/evidence/*.png
          if-no-files-found: ignore
      - name: Compose diagnostics and cleanup
        if: always()
        run: |
          if [ -n "${CAUCHE_COMPOSE_ENV_FILE:-}" ] && [ -f "$CAUCHE_COMPOSE_ENV_FILE" ]; then
            docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" ps -a
            docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" logs --no-color --tail 60
            docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" down -v
          else
            docker compose ps -a || true
            docker compose logs --no-color --tail 60 || true
            docker compose down -v || true
          fi
      - name: Remove ephemeral files
        if: always()
        run: python scripts/ci_secrets.py cleanup

  managed-cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci && npm test
        working-directory: cloudflare
      - run: docker build -f Dockerfile.cloudflare -t cauche-pulse-managed:ci .
