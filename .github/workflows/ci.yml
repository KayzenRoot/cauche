name: CAUCHE PULSE
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.31
      - run: uv sync --locked
      - run: uv run --locked ruff check app tests alembic
      - run: uv run --locked python -m pytest --cov=app --cov-report=term-missing
      - run: uv run --locked bandit -r app --severity-level medium
      - run: uv run --locked pip-audit

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build && npm run build:free
      - run: node --test tests/research.test.ts
      - run: npm audit --audit-level=moderate

  source-and-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - run: python scripts/validate_docs.py
      - run: >
          docker run --rm -v "${PWD}:/repo:ro" --workdir /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner /repo

  compose-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Configure ephemeral encryption
        run: |
          test_key="$(python -c 'import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
          echo "::add-mask::${test_key}"
          echo "CAUCHE_MASTER_KEY=${test_key}" >> "$GITHUB_ENV"
      - run: docker compose config --quiet && docker compose up --build -d --wait
      - run: docker compose exec -T api alembic current --check-heads && docker compose exec -T api alembic check
      - name: Bootstrap ephemeral test owner
        run: |
          test_password="$(openssl rand -hex 24)"
          echo "::add-mask::${test_password}"
          echo "CAUCHE_TEST_PASSWORD=${test_password}" >> "$GITHUB_ENV"
          printf '%s\n' "${test_password}" | docker compose exec -T api python -m app.bootstrap --email owner@example.test --password-file /dev/stdin
      - run: npm ci && npx playwright install --with-deps chromium && npm test
        working-directory: tests/e2e
      - run: npm audit --audit-level=moderate
        working-directory: tests/e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-evidence
          path: tests/e2e/test-results/evidence/*.png
          if-no-files-found: ignore
      - run: docker compose ps -a && docker compose logs --no-color --tail 60
        if: always()
      - run: docker compose down
        if: always()

  managed-cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci && npm test
        working-directory: cloudflare
      - run: docker build -f Dockerfile.cloudflare -t cauche-pulse-managed:ci .
