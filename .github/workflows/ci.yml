name: CAUCHE PULSE
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.31
      - run: uv sync --locked
      - run: uv run --locked ruff check app tests alembic
      - name: Start ephemeral PostgreSQL with per-run credentials
        run: |
          set -euo pipefail
          umask 077
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          password_file="$RUNNER_TEMP/cauche-ci-postgres-password"
          env_file="$RUNNER_TEMP/cauche-ci-postgres.env"
          printf '%s' "$password" > "$password_file"
          chmod 600 "$password_file"
          printf 'POSTGRES_PASSWORD=%s\nPOSTGRES_HOST_AUTH_METHOD=scram-sha-256\n' "$password" > "$env_file"
          chmod 600 "$env_file"
          container="cauche-ci-postgres"
          docker rm -f -v "$container" >/dev/null 2>&1 || true
          docker run -d --name "$container" --env-file "$env_file" \
            -e POSTGRES_USER=cauche_test -e POSTGRES_DB=cauche_test \
            -p "127.0.0.1::5432" --shm-size=256m \
            --health-cmd "pg_isready -U cauche_test -d cauche_test" \
            --health-interval 2s --health-timeout 2s --health-retries 30 \
            postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
          port="$(docker port "$container" 5432/tcp | head -1 | awk -F: '{print $NF}')"
          case "$port" in
            ''|*[!0-9]*) echo "POSTGRES_LOOPBACK_PORT_UNAVAILABLE"; exit 1 ;;
          esac
          docker port "$container" 5432/tcp | grep -q '^127.0.0.1:' || { echo "POSTGRES_NOT_LOOPBACK_BOUND"; exit 1; }
          echo "POSTGRES_LOOPBACK_BINDING_OK $(docker port "$container" 5432/tcp | head -1)"
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          status="$(docker inspect -f '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
          if [ "$status" != "healthy" ]; then
            docker logs "$container" || true
            exit 1
          fi
          docker cp "$password_file" "$container:/tmp/pg-password"
          docker exec -u 0 "$container" chown postgres:postgres /tmp/pg-password
          docker exec -u 0 "$container" chmod 600 /tmp/pg-password
          docker exec "$container" sh -c 'PGPASSFILE=/dev/null PGPASSWORD="$(cat /tmp/pg-password)" psql -w -h 127.0.0.1 -U cauche_test -d cauche_test -v ON_ERROR_STOP=1 -tAc "select current_user"' | grep -qx "cauche_test"
          echo "POSTGRES_AUTH_POSITIVE_OK"
          if no_password_output="$(docker exec "$container" sh -c 'PGPASSFILE=/dev/null PGPASSWORD="" psql -w -h 127.0.0.1 -U cauche_test -d cauche_test -tAc "select 1"' 2>&1)"; then
            echo "POSTGRES_AUTH_NO_PASSWORD_UNEXPECTEDLY_ALLOWED"
            exit 1
          fi
          printf '%s' "$no_password_output" | grep -qiE 'password|authentication' || { echo "POSTGRES_AUTH_NO_PASSWORD_WRONG_FAILURE"; printf '%s\n' "$no_password_output"; exit 1; }
          echo "POSTGRES_AUTH_NO_PASSWORD_DENIED"
          if wrong_password_output="$(docker exec "$container" sh -c 'PGPASSFILE=/dev/null PGPASSWORD="definitely-wrong" psql -w -h 127.0.0.1 -U cauche_test -d cauche_test -tAc "select 1"' 2>&1)"; then
            echo "POSTGRES_AUTH_WRONG_PASSWORD_UNEXPECTEDLY_ALLOWED"
            exit 1
          fi
          printf '%s' "$wrong_password_output" | grep -qiE 'password|authentication' || { echo "POSTGRES_AUTH_WRONG_PASSWORD_WRONG_FAILURE"; printf '%s\n' "$wrong_password_output"; exit 1; }
          echo "POSTGRES_AUTH_WRONG_PASSWORD_DENIED"
          docker exec "$container" sh -c "grep -E '^host' /var/lib/postgresql/data/pg_hba.conf"
          if docker exec "$container" sh -c "grep -E '^host' /var/lib/postgresql/data/pg_hba.conf | grep -v 'scram-sha-256'"; then
            echo "POSTGRES_HOST_AUTH_NOT_SCRAM"
            exit 1
          fi
          docker exec "$container" rm -f /tmp/pg-password
          {
            echo "CAUCHE_TEST_POSTGRES_PORT=$port"
            echo "CAUCHE_TEST_POSTGRES_PASSWORD_FILE=$password_file"
            echo "CAUCHE_TEST_POSTGRES_CONTAINER=$container"
            echo "CAUCHE_TEST_POSTGRES_ENV_FILE=$env_file"
          } >> "$GITHUB_ENV"
      - run: uv run --locked python -m pytest --cov=app --cov-report=term-missing
      - run: uv run --locked bandit -r app --severity-level medium
      - run: uv run --locked pip-audit
      - name: Clean up ephemeral PostgreSQL
        if: always()
        run: |
          docker rm -f -v "${CAUCHE_TEST_POSTGRES_CONTAINER:-cauche-ci-postgres}" >/dev/null 2>&1 || true
          rm -f "${CAUCHE_TEST_POSTGRES_PASSWORD_FILE:-$RUNNER_TEMP/cauche-ci-postgres-password}"
          rm -f "${CAUCHE_TEST_POSTGRES_ENV_FILE:-$RUNNER_TEMP/cauche-ci-postgres.env}"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build && npm run build:free
      - run: node --test tests/research.test.ts
      - run: npm audit --audit-level=moderate

  source-and-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - run: python scripts/validate_docs.py
      - run: >
          docker run --rm -v "${PWD}:/repo:ro" --workdir /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner /repo

  compose-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Configure ephemeral secrets
        run: |
          set -euo pipefail
          umask 077
          test_key="$(python -c 'import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
          db_password="$(openssl rand -hex 24)"
          echo "::add-mask::${test_key}"
          echo "::add-mask::${db_password}"
          env_file="$RUNNER_TEMP/cauche-compose.env"
          printf 'CAUCHE_MASTER_KEY=%s\nPOSTGRES_PASSWORD=%s\n' "$test_key" "$db_password" > "$env_file"
          chmod 600 "$env_file"
          echo "CAUCHE_COMPOSE_ENV_FILE=$env_file" >> "$GITHUB_ENV"
      - name: Validate and start Compose
        run: |
          docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" config --quiet
          docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" up --build -d --wait
      - name: Verify migrations
        run: |
          docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" exec -T api alembic current --check-heads
          docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" exec -T api alembic check
      - name: Bootstrap ephemeral test owner
        run: |
          set -euo pipefail
          umask 077
          test_password="$(openssl rand -hex 24)"
          echo "::add-mask::${test_password}"
          password_file="$RUNNER_TEMP/cauche-test-owner-password"
          printf '%s' "$test_password" > "$password_file"
          chmod 600 "$password_file"
          echo "CAUCHE_TEST_PASSWORD_FILE=$password_file" >> "$GITHUB_ENV"
          printf '%s\n' "$test_password" | docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" exec -T api python -m app.bootstrap --email owner@example.test --password-file /dev/stdin
      - run: npm ci && npx playwright install --with-deps chromium && npm test
        working-directory: tests/e2e
      - run: npm audit --audit-level=moderate
        working-directory: tests/e2e
      - name: Rehearse isolated PostgreSQL backup and restore
        run: bash scripts/ci_restore.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-evidence
          path: tests/e2e/test-results/evidence/*.png
          if-no-files-found: ignore
      - name: Compose diagnostics and cleanup
        if: always()
        run: |
          if [ -n "${CAUCHE_COMPOSE_ENV_FILE:-}" ] && [ -f "$CAUCHE_COMPOSE_ENV_FILE" ]; then
            docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" ps -a
            docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" logs --no-color --tail 60
            docker compose --env-file "$CAUCHE_COMPOSE_ENV_FILE" down -v
          else
            docker compose ps -a || true
            docker compose logs --no-color --tail 60 || true
            docker compose down -v || true
          fi
      - name: Remove ephemeral secret files
        if: always()
        run: |
          rm -f "${CAUCHE_COMPOSE_ENV_FILE:-$RUNNER_TEMP/cauche-compose.env}"
          rm -f "${CAUCHE_TEST_PASSWORD_FILE:-$RUNNER_TEMP/cauche-test-owner-password}"

  managed-cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci && npm test
        working-directory: cloudflare
      - run: docker build -f Dockerfile.cloudflare -t cauche-pulse-managed:ci .
